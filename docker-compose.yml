# Coolify Multi-Container Stack (Next.js App + PostgreSQL 17)
# Coolify otomatik olarak SERVICE_PASSWORD_POSTGRES, SERVICE_PASSWORD_JWT ve SERVICE_FQDN_APP_3000 değerlerini üretir/yönetir.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES:-otobeyin}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-otobeyin}
    volumes:
      - otobeyin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      - SERVICE_FQDN_APP_3000=${SERVICE_FQDN_APP_3000:-https://oto.erkanerdem.online}
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${SERVICE_USER_POSTGRES:-otobeyin}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-otobeyin}?schema=public
      - JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - NEXT_PUBLIC_APP_URL=${SERVICE_URL_APP:-https://oto.erkanerdem.online}
      - SMS_PROVIDER=${SMS_PROVIDER:-sandbox}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-sandbox}
      - CARGO_PROVIDER=${CARGO_PROVIDER:-sandbox}
      - EINVOICE_PROVIDER=${EINVOICE_PROVIDER:-sandbox}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

volumes:
  otobeyin_pgdata:
