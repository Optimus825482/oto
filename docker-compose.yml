services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-otobeyin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-otobeyin_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-otobeyin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - otobeyin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-otobeyin} -d ${POSTGRES_DB:-otobeyin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-otobeyin}:${POSTGRES_PASSWORD:-otobeyin_dev_pass}@postgres:5432/${POSTGRES_DB:-otobeyin}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-min-32-chars}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}

volumes:
  otobeyin_pgdata:
